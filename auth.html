<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in to FixitBw</title>
    <link rel="icon" type="image/png" href="logo.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts -->
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@200,300,400,500,600,700&amp;f[]=general-sans@200,300,400,500,600&amp;display=swap" rel="stylesheet">
    
    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>

    <script>
        tailwind.config = {
            theme: { 
                extend: { 
                    fontFamily: { 
                        display: ['Clash Display', 'sans-serif'], 
                        body: ['General Sans', 'sans-serif'], 
                    }, 
                    colors: { 
                        'accent': '#f97316', 
                        'dark': '#000000', 
                    }
                } 
            }
        }
    </script>

    <style>
        :root {
            --bg-body: #000000;
            --text-main: #ffffff;
            --text-muted: #71767b;
            --input-border: #333639;
            --btn-hover: rgba(239, 243, 244, 0.1);
        }

        [data-theme="light"] {
            --bg-body: #ffffff;
            --text-main: #0f1419;
            --text-muted: #536471;
            --input-border: #cfd9de;
            --btn-hover: rgba(15, 20, 25, 0.1);
        }

        body { 
            background-color: var(--bg-body); 
            color: var(--text-main); 
            font-family: 'General Sans', sans-serif;
            min-height: 100vh; /* Changed from height to min-height for scrolling */
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-y: auto; /* Enabled scrolling */
            overflow-x: hidden;
            transition: background-color 0.3s ease;
            padding: 20px 0; /* Add padding for vertical spacing on small screens */
        }

        /* --- CUSTOM SCROLLBAR --- */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-body); }
        ::-webkit-scrollbar-thumb { background: var(--input-border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        /* X-Style Modal */
        .auth-container {
            width: 100%;
            max-width: 600px;
            /* Removed min-height to fit content nicely */
            background: var(--bg-body);
            position: relative;
            padding: 0 32px;
            display: flex;
            flex-direction: column;
            margin: auto; /* Helps with centering when scrolling */
        }

        @media (min-width: 768px) {
            .auth-container {
                height: auto;
                border-radius: 16px;
                padding: 40px 80px;
                box-shadow: 0 0 15px rgba(255,255,255,0.1);
            }
            [data-theme="light"] .auth-container {
                box-shadow: 0 0 15px rgba(0,0,0,0.1);
            }
        }

        /* Pill Buttons */
        .btn-social {
            width: 100%;
            border-radius: 9999px;
            background-color: var(--text-main);
            color: var(--bg-body);
            font-weight: 600;
            font-size: 15px;
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 12px;
            transition: all 0.2s;
            border: 1px solid transparent;
            cursor: pointer;
        }
        
        .btn-social:hover { opacity: 0.9; }

        /* Outline Button (for other providers) */
        .btn-outline {
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--input-border);
        }
        .btn-outline:hover { background-color: var(--btn-hover); }

        /* Primary Action Button */
        .btn-primary {
            background-color: #f97316; /* Fixit Orange */
            color: white;
            border: none;
        }
        .btn-primary:hover { background-color: #ea580c; }

        /* Input Fields - Floating Label Style */
        .input-group { position: relative; margin-bottom: 20px; }
        
        .input-field {
            width: 100%;
            background: transparent;
            border: 1px solid var(--input-border);
            border-radius: 4px;
            padding: 16px 8px 8px 8px;
            color: var(--text-main);
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        
        .input-field:focus {
            border-color: #f97316;
            box-shadow: 0 0 0 1px #f97316;
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
            color: var(--text-main);
        }
        .divider::before, .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--input-border);
        }
        .divider span { padding: 0 10px; font-size: 14px; }

        .error-msg {
            color: #ef4444;
            font-size: 12px;
            text-align: center;
            margin-top: 10px;
            display: none;
        }
    </style>

    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            const html = document.documentElement;
            if (savedTheme === 'light') html.setAttribute('data-theme', 'light');
            else if (savedTheme === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches) html.setAttribute('data-theme', 'light');
        })();
    </script>
</head>
<body>

    <!-- Main Modal -->
    <div class="auth-container anim-entry">
        
        <!-- Header: Close + Logo -->
        <div class="flex justify-between items-center mb-8 relative">
            <a href="index.html" class="p-2 rounded-full hover:bg-zinc-800/10 transition-colors text-theme-main">
                <iconify-icon icon="lucide:x" width="20"></iconify-icon>
            </a>
            <div class="absolute left-1/2 -translate-x-1/2">
                <img src="logo.png" alt="FixitBw" class="w-8 h-8 object-contain">
            </div>
            <div class="w-8"></div> <!-- Spacer for centering -->
        </div>

        <!-- Dynamic Content Area -->
        <div class="flex flex-col flex-grow max-w-[380px] mx-auto w-full">
            
            <h1 id="auth-heading" class="text-3xl font-display font-bold mb-8 text-center sm:text-left">Sign in to FixitBw</h1>

            <!-- Social Buttons -->
            <button id="btn-google" class="btn-social btn-outline">
                <iconify-icon icon="flat-color-icons:google" width="18"></iconify-icon>
                Sign in with Google
            </button>
            
            <button id="btn-outlook" class="btn-social btn-outline font-bold">
                <iconify-icon icon="logos:microsoft-icon" width="18"></iconify-icon>
                Sign in with Outlook
            </button>
            
            <button id="btn-yahoo" class="btn-social btn-outline font-bold">
                <iconify-icon icon="logos:yahoo" width="18"></iconify-icon>
                Sign in with Yahoo
            </button>

            <!-- Divider -->
            <div class="divider"><span>or</span></div>

            <!-- Form -->
            <form id="auth-form">
                
                <!-- Name Field (Hidden by default for Login) -->
                <div id="name-container" class="input-group hidden">
                    <input type="text" id="full-name" class="input-field" placeholder="Full Name">
                </div>

                <div class="input-group">
                    <input type="email" id="email" required class="input-field" placeholder="Email address">
                </div>

                <div class="input-group">
                    <input type="password" id="password" required class="input-field" placeholder="Password">
                </div>

                <button type="submit" class="btn-social btn-primary mt-4">
                    <span id="submit-text">Next</span>
                </button>

                <div id="error-message" class="error-msg">Authentication failed</div>
                
                <button type="button" class="btn-social btn-outline mt-4 font-bold text-sm">
                    Forgot password?
                </button>
            </form>

            <!-- Footer Toggle -->
            <div class="mt-8 text-[15px] text-theme-muted mb-8">
                <span id="footer-text">Don't have an account?</span>
                <button onclick="toggleMode()" class="text-accent hover:underline ml-1 font-medium" id="toggle-btn">Sign up</button>
            </div>
        </div>

    </div>

    <!-- Firebase Logic -->
    <script type="module">
        import { auth, GoogleAuthProvider, OAuthProvider, signInWithPopup, signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile } from './firebase-config.js';

        gsap.from(".anim-entry", { opacity: 0, scale: 0.95, duration: 0.4, ease: "power2.out" });

        let currentMode = 'signin'; // 'signin' or 'signup'
        
        // Cache DOM elements
        const nameContainer = document.getElementById('name-container');
        const heading = document.getElementById('auth-heading');
        const submitText = document.getElementById('submit-text');
        const footerText = document.getElementById('footer-text');
        const toggleBtn = document.getElementById('toggle-btn');
        const errorMsg = document.getElementById('error-message');

        // Make toggle function global
        window.toggleMode = function() {
            errorMsg.style.display = 'none';
            if (currentMode === 'signin') {
                // Switch to Sign Up
                currentMode = 'signup';
                heading.innerText = "Join FixitBw today";
                submitText.innerText = "Create account";
                footerText.innerText = "Have an account already?";
                toggleBtn.innerText = "Log in";
                
                // Show Name
                nameContainer.classList.remove('hidden');
                gsap.from(nameContainer, { height: 0, opacity: 0, duration: 0.3 });
            } else {
                // Switch to Sign In
                currentMode = 'signin';
                heading.innerText = "Sign in to FixitBw";
                submitText.innerText = "Next";
                footerText.innerText = "Don't have an account?";
                toggleBtn.innerText = "Sign up";
                
                // Hide Name
                nameContainer.classList.add('hidden');
            }
        }

        // Social Login Handler
        async function socialLogin(providerName) {
            let provider;
            if (providerName === 'google') provider = new GoogleAuthProvider();
            if (providerName === 'microsoft') provider = new OAuthProvider('microsoft.com');
            if (providerName === 'yahoo') provider = new OAuthProvider('yahoo.com');

            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;
                askForNotificationAndRedirect(user);
            } catch (error) {
                console.error(error);
                showError(error.message);
            }
        }

        // Attach Social Events
        document.getElementById('btn-google').addEventListener('click', () => socialLogin('google'));
        document.getElementById('btn-outlook').addEventListener('click', () => socialLogin('microsoft'));
        document.getElementById('btn-yahoo').addEventListener('click', () => socialLogin('yahoo'));

        // Email Form Handler
        document.getElementById('auth-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const fullName = document.getElementById('full-name').value;
            const btn = document.querySelector('button[type="submit"]');
            
            // Loading State
            btn.innerHTML = `<iconify-icon icon="line-md:loading-loop" width="20"></iconify-icon>`;
            errorMsg.style.display = 'none';

            try {
                if (currentMode === 'signup') {
                    // Create User
                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    // Update Name
                    await updateProfile(userCredential.user, {
                        displayName: fullName || 'Fixit Member',
                        photoURL: `https://ui-avatars.com/api/?name=${encodeURIComponent(fullName || 'User')}&background=f97316&color=fff`
                    });
                    askForNotificationAndRedirect(userCredential.user);
                } else {
                    // Sign In
                    const userCredential = await signInWithEmailAndPassword(auth, email, password);
                    askForNotificationAndRedirect(userCredential.user);
                }
            } catch (error) {
                btn.innerHTML = `<span id="submit-text">${currentMode === 'signup' ? 'Create Account' : 'Next'}</span>`;
                // Clean up error message
                let cleanMsg = error.code.replace('auth/', '').replace(/-/g, ' ');
                showError(cleanMsg);
            }
        });

        function showError(msg) {
            errorMsg.innerText = msg.charAt(0).toUpperCase() + msg.slice(1);
            errorMsg.style.display = 'block';
            gsap.from(errorMsg, {y: -10, opacity: 0});
        }

        function askForNotificationAndRedirect(user) {
            // Local Storage for legacy support/offline checks
            localStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('userEmail', user.email);

            if (currentMode === 'signup' || !localStorage.getItem('notificationAsked')) {
                localStorage.setItem('notificationAsked', 'true');
                
                if (!("Notification" in window)) {
                    window.location.href = 'index.html';
                } else if (Notification.permission !== "denied" && Notification.permission !== "granted") {
                    Notification.requestPermission().then(function (permission) {
                        if (permission === "granted") {
                            new Notification(`Welcome ${user.displayName || 'Builder'}!`, {
                                body: "You will receive updates on new stock.",
                                icon: "logo.png"
                            });
                        }
                        window.location.href = 'index.html';
                    });
                } else {
                    // Already granted or denied
                    window.location.href = 'index.html';
                }
            } else {
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
